<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Výpůjčky | Hory a voda</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 74 100'%3E%3Crect width='74' height='100' rx='5.9' ry='6' fill='%231F6B7A'/%3E%3Ccircle cx='37' cy='15.5' r='5.5' fill='%23F7F5F0'/%3E%3Cpolygon points='11.84,70 31.97,42.4 41.03,55.6 48.07,49 62.16,70' fill='%23fff'/%3E%3Crect x='11.84' y='77' width='50.32' height='4.5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="topbar-brand" aria-label="Hory a voda – přehled">
      <span class="mark" aria-hidden="true"><i></i></span>
      <span class="wordmark-name">Hory a voda</span>
    </a>
    <button type="button" class="topbar-toggle" id="menuToggle" aria-expanded="false" aria-controls="topbarMenu">Menu</button>
    <div class="topbar-menu" id="topbarMenu">
      <nav class="topnav" aria-label="Hlavní navigace">
        <a href="/">Přehled</a>
        <a href="/rentals.html" aria-current="page">Výpůjčky</a>
        <a href="/reservations.html">Rezervace</a>
        <a href="/customers.html">Zákazníci</a>
        <a href="/categories.html">Ceník</a>
      </nav>
      <span class="topbar-clock" id="topbarClock"></span>
      <div class="topbar-user">
        <span class="user-name" id="userNameDisplay"></span>
        <button id="logoutBtn" class="hv-btn hv-btn--ghost">Odhlásit</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 class="hv-display page-title">Výpůjčky</h1>
        <p class="page-sub" id="rentalsSummary">Načítám…</p>
      </div>
      <button id="openRentalModalBtn" class="hv-btn hv-btn--primary hv-btn--lg">Nová výpůjčka</button>
    </div>

    <div class="toolbar">
      <div class="cat-tabs" id="rentalFilter" role="group" aria-label="Filtr výpůjček">
        <button type="button" class="cat-tab" data-filter="open" aria-pressed="true">Otevřené<span class="cat-tab-count" id="countOpen">0</span></button>
        <button type="button" class="cat-tab" data-filter="overdue" aria-pressed="false">Po termínu<span class="cat-tab-count" id="countOverdue">0</span></button>
        <button type="button" class="cat-tab" data-filter="all" aria-pressed="false">Všechny<span class="cat-tab-count" id="countAll">0</span></button>
      </div>
      <label class="search-field">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/>
        </svg>
        <input type="search" id="rentalSearchInput" class="hv-input" placeholder="Zákazník nebo inventární číslo" aria-label="Hledat výpůjčku">
      </label>
    </div>

    <div class="rental-list" id="rentalList">
      <div class="board-empty">Načítám…</div>
    </div>
  </main>

  <div id="rentalModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="rentalModalTitle">
    <div class="modal-card modal-card--wide">
      <div class="modal-header">
        <h3 id="rentalModalTitle">Nová výpůjčka</h3>
        <button type="button" class="modal-close" data-close aria-label="Zavřít">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <form id="rentalForm">
        <div class="modal-body">
          <div class="alert alert-danger"></div>
          <div class="form-grid">
            <label class="hv-field span-2">
              <span class="hv-label">Zákazník</span>
              <select id="rentalCustomer" class="hv-input" required></select>
            </label>
            <label class="hv-field">
              <span class="hv-label">Od</span>
              <input type="datetime-local" id="rentalStart" class="hv-input num" required>
            </label>
            <label class="hv-field">
              <span class="hv-label">Do</span>
              <input type="datetime-local" id="rentalEnd" class="hv-input num" required>
            </label>
            <label class="hv-field">
              <span class="hv-label">Kategorie</span>
              <select id="rentalCategoryFilter" class="hv-input"></select>
            </label>
            <label class="hv-field">
              <span class="hv-label">Sleva (Kč)</span>
              <input type="number" id="rentalDiscount" class="hv-input num" min="0" step="10" value="0">
            </label>
          </div>
          <div class="hv-field">
            <span class="hv-label">Kusy <span class="hv-help" id="rentalPickedCount">vybráno 0</span></span>
            <div class="tag-grid tag-grid--pick" id="rentalItemPicker"></div>
            <span class="hv-help">Nabízí se kusy, které jsou teď na place. Překryv s jinou výpůjčkou nebo rezervací systém ověří při uložení.</span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="hv-btn hv-btn--ghost" data-close>Zrušit</button>
          <button type="submit" id="rentalSubmitBtn" class="hv-btn hv-btn--primary">Vydat</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/rentals.js"></script>
</body>
</html>
